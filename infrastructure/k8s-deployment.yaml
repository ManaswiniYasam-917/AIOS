apiVersion: apps/v1
kind: Deployment
metadata:
  name: aios-backend
  namespace: aios-enterprise
  labels:
    app: aios-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aios-backend
  template:
    metadata:
      labels:
        app: aios-backend
    spec:
      containers:
      - name: backend
        image: aios-registry.internal/aios-backend:v1.0.0
        ports:
        - containerPort: 8000
        - containerPort: 50051
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: aios-secrets
              key: database-url
        - name: REDIS_URL
          value: "redis://aios-redis-service:6379/0"
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: aios-secrets
              key: jwt-secret
        resources:
          limits:
            cpu: "2"
            memory: 4Gi
          requests:
            cpu: "500m"
            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: aios-backend-service
  namespace: aios-enterprise
spec:
  selector:
    app: aios-backend
  ports:
  - name: http
    protocol: TCP
    port: 8000
    targetPort: 8000
  - name: grpc
    protocol: TCP
    port: 50051
    targetPort: 50051
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aios-frontend
  namespace: aios-enterprise
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aios-frontend
  template:
    metadata:
      labels:
        app: aios-frontend
    spec:
      containers:
      - name: frontend
        image: aios-registry.internal/aios-frontend:v1.0.0
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "1"
            memory: 2Gi
          requests:
            cpu: "250m"
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: aios-frontend-service
  namespace: aios-enterprise
spec:
  selector:
    app: aios-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aios-gateway-ingress
  namespace: aios-enterprise
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
  - host: aios.enterprise.internal
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: aios-backend-service
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aios-frontend-service
            port:
              number: 80
